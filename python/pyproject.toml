[project]
name = "mycobot-console"
version = "0.1.0"
description = "Servicio de ejecución segura de Python para la consola del simulador myCobot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
]

[project.optional-dependencies]
hardware = ["pymycobot>=4.0"]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "black>=24",
  "ruff>=0.6",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
